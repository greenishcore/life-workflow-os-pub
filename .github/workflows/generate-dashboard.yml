name: generate-dashboard

# vault 内容或看板脚本变化时，自动重新生成看板 HTML 并提交回仓库
on:
  push:
    paths:
      - 'vault/**'
      - 'lifeos/html_dashboard.py'
      - 'lifeos/models.py'
      - 'lifeos/stats.py'
      - 'scripts/dashboard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 scripts/dashboard.py
      - name: Commit regenerated dashboard if changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "dashboard 无变更"
          else
            git commit -m "chore: 重新生成看板 $(date -u +%FT%TZ)"
            git push
          fi
