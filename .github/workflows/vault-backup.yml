name: vault-backup

# 定时备份 + 手动触发：把 vault 改动自动 commit + push 到 GitHub
on:
  schedule:
    - cron: '0 2 * * *'   # 每天 02:00 UTC
  workflow_dispatch:        # 手动触发（Actions 页面 Run workflow）

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit and push any changes
        run: |
          git config user.name "vault-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "auto backup $(date -u +%FT%TZ)"
            git push
          fi
