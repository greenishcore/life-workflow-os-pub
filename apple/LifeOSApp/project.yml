# xcodegen 工程规格。
# 只把这份 YAML 入库，.xcodeproj 由 `xcodegen generate` 生成（可重建、不产生合并冲突）。
name: LifeOS
options:
  bundleIdPrefix: com.lifeos
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  LifeWorkflowKit:
    path: ../LifeWorkflowKit

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # 自动签名。团队来自 Signing.xcconfig，默认为空 —— 空团队时模拟器照常构建，
    # 真机构建会得到 Xcode 明确的「未选择团队」提示，而不是装到一半才报
    # 「No code signature found」。
    #
    # **别再把 CODE_SIGNING_ALLOWED 设成 NO**：那会让构建产物完全没有签名，
    # 于是即便配好了 Apple ID 与描述文件，真机安装也永远失败。这个坑踩过一次。
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(LIFEOS_DEVELOPMENT_TEAM)
    ENABLE_HARDENED_RUNTIME: "NO"

targets:
  LifeOS-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
    dependencies:
      - package: LifeWorkflowKit
    settings:
      base:
        PRODUCT_NAME: Life Workflow OS
        # macOS 端刻意保持 ad-hoc 签名：桌面应用不需要描述文件，ad-hoc 本地就能跑，
        # 这样没有开发团队的人 clone 下来也能构建出可用的 .app。
        # iOS / watchOS 则必须走自动签名，否则装不上真机。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.workflow
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: "YES"
    info:
      path: Resources/Info-macOS.plist
      properties:
        CFBundleName: Life Workflow OS
        CFBundleDisplayName: Life Workflow OS
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.productivity
        # Apple 数据链路需要的权限说明（缺了会在请求权限时直接崩）
        NSAppleEventsUsageDescription: 用于把「提醒事项」「日历」「备忘录」的内容导入到你的本地 Markdown 知识库。
        NSRemindersFullAccessUsageDescription: 用于把提醒事项导入到当天的 Daily 笔记。
        NSCalendarsFullAccessUsageDescription: 用于把日历事件导入到当天的 Daily 笔记。

  LifeOS-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    dependencies:
      - package: LifeWorkflowKit
      # 手表应用嵌在 iOS 应用里 —— 这是「伴侣应用」的必要条件，
      # 也是 WatchConnectivity 能用的前提（免费账号下唯一可用的手表数据通道）。
      - target: LifeOS-watchOS
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: Life Workflow OS
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.workflow
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
        # 免费 Apple ID 无法使用 iCloud 权益；vault 通过文档选择器 + 书签接入，
        # 用户可以选 iCloud Drive 里的目录，不需要任何权益。
        # 签名继承项目级的自动签名，不在这里覆盖。
    info:
      path: Resources/Info-iOS.plist
      properties:
        CFBundleName: Life Workflow OS
        CFBundleDisplayName: 生活工作流
        UILaunchScreen: {}
        # 四个方向都要声明：target 支持 iPad（TARGETED_DEVICE_FAMILY "1,2"），
        # 而 iPad 上不支持全部方向就会有构建警告，除非声明 UIRequiresFullScreen。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 让 vault 在「文件」App 里可见可编辑，用户能自己放进 iCloud Drive
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSRemindersFullAccessUsageDescription: 用于把提醒事项导入到当天的 Daily 笔记。
        NSCalendarsFullAccessUsageDescription: 用于把日历事件导入到当天的 Daily 笔记。
        NSMicrophoneUsageDescription: 用于语音听写快速捕获想法。
        NSSpeechRecognitionUsageDescription: 用于把语音转成文字，快速记下想法。

  LifeOS-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Shared
      - path: Sources/watchOS
    dependencies:
      - package: LifeWorkflowKit
    settings:
      base:
        PRODUCT_NAME: 生活工作流
        PRODUCT_BUNDLE_IDENTIFIER: com.lifeos.workflow.watchkitapp
        # 签名继承项目级的自动签名。手表是伴侣应用，它和 iOS 应用各自需要一份
        # 描述文件，Xcode 会按 bundle ID 自动签发。
    info:
      path: Resources/Info-watchOS.plist
      properties:
        CFBundleName: 生活工作流
        CFBundleDisplayName: 生活工作流
        # watchOS 7+ 的单 target 手表应用
        WKApplication: true
        # 指向 iOS 应用 —— 没有这一条就不是伴侣应用，WatchConnectivity 用不了
        WKCompanionAppBundleIdentifier: com.lifeos.workflow
